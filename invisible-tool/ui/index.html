<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Invisible Tool</title>
<style>
  :root {
    color-scheme: light dark;
    --accent: #2563eb;
    --bad: #b91c1c;
    --good: #15803d;
    --warn: #b45309;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 920px;
    margin: 2rem auto;
    padding: 0 1rem;
    line-height: 1.5;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  h1 { font-size: 1.4rem; margin-bottom: 0; }
  .subtitle { color: #555; margin-top: 0.25rem; }
  .lang-switch { display: flex; align-items: center; gap: 0.5rem; }
  .lang-switch select { padding: 0.3rem; }
  .actions { display: flex; gap: 0.75rem; margin: 1rem 0; flex-wrap: wrap; }
  button { padding: 0.5rem 1rem; cursor: pointer; }
  input[type="text"] { padding: 0.5rem; }
  .status { margin: 0.5rem 0; font-style: italic; color: #555; }
  .status.error { color: var(--bad); font-style: normal; font-weight: 600; }
  section.report { margin-top: 1.5rem; border-top: 1px solid #ddd; padding-top: 1rem; }
  section.report h2 { font-size: 1.1rem; }
  .explanation { font-size: 0.9rem; color: #444; margin-bottom: 0.75rem; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 0.5rem; }
  th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid #eee; font-size: 0.92rem; }
  .verdict-badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-weight: 600; font-size: 0.85rem; }
  .verdict-ACCESO_LEGITIMO { background: #dcfce7; color: var(--good); }
  .verdict-BLOQUEO_ESPERADO { background: #dcfce7; color: var(--good); }
  .verdict-ACCESO_INDEBIDO { background: #fee2e2; color: var(--bad); }
  .verdict-ACCESO_LEGITIMO_FALLIDO { background: #fef3c7; color: var(--warn); }
  .verdict-INDETERMINADO { background: #fef3c7; color: var(--warn); }
  .meta { font-size: 0.82rem; color: #666; }
  footer { margin-top: 2rem; font-size: 0.78rem; color: #888; border-top: 1px solid #eee; padding-top: 0.75rem; }
  code { background: #f3f4f6; padding: 0.1rem 0.3rem; border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div>
    <h1 data-i18n="title">Invisible Tool</h1>
    <p class="subtitle" data-i18n="subtitle"></p>
  </div>
  <div class="lang-switch">
    <label for="lang-select" data-i18n="langLabel">Language</label>
    <select id="lang-select">
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>
  </div>
</header>

<div class="actions">
  <button id="run-button" data-i18n="runButton">Run live check</button>
  <input type="text" id="recover-run-id" data-i18n-placeholder="recoverPlaceholder" />
  <button id="recover-button" data-i18n="recoverButton">Recover report by ID</button>
</div>

<p id="status" class="status"></p>

<div id="results"></div>

<footer data-i18n="footerNote"></footer>

<script src="ui/translations.js"></script>
<script src="ui/app.js"></script>
</body>
</html>
